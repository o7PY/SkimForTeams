[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skim"
version = "0.1.0"
description = "Skim Phase 1: Teams retrieval & visibility"
requires-python = ">=3.12"
dependencies = [
  "microsoft-agents-activity==1.9.0",
  "microsoft-agents-hosting-core==1.9.0",
  "microsoft-agents-hosting-aiohttp==1.9.0",
  "microsoft-agents-authentication-msal==1.9.0",
  "aiohttp==3.14.5",
  "asyncpg==0.32.0",
  "pydantic>=2.9",
  "pypdf==6.21.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.setuptools.package-data]
"skim.ai.prompts" = ["*.md"]
